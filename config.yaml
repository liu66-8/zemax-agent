# =============================================================================
# Zemax-Agent 默认配置文件
# 所有配置项均设有默认值，可按需修改
# 环境变量覆盖规则：ZEMAX_AGENT_<SECTION>__<KEY>（优先级最高）
# =============================================================================

# -----------------------------------------------------------------------------
# Zemax OpticStudio 连接配置
# -----------------------------------------------------------------------------
zemax:
  # 连接模式: standalone（独立模式）| extension（扩展模式）
  connection_mode: standalone
  # 连接超时时间（秒）
  connection_timeout: 30.0
  # 断开后是否自动重连
  auto_reconnect: true
  # 最大重连尝试次数
  max_reconnect_attempts: 3

# -----------------------------------------------------------------------------
# 大语言模型 (LLM) 配置
# -----------------------------------------------------------------------------
llm:
  # LLM 服务提供商: openai | azure | local
  provider: openai
  # API 密钥（建议通过环境变量 ZEMAX_AGENT_LLM__API_KEY 设置）
  api_key: ""
  # API 基础地址
  api_base: https://api.openai.com/v1
  # 模型名称
  model: gpt-4
  # 最大生成 token 数
  max_tokens: 4096
  # 生成温度（越低越确定性）
  temperature: 0.1
  # 请求超时时间（秒）
  request_timeout: 60.0
  # 最大重试次数
  max_retries: 3

# -----------------------------------------------------------------------------
# 光学系统优化配置
# -----------------------------------------------------------------------------
optimization:
  # 最大迭代次数
  max_iterations: 100
  # 收敛阈值
  convergence_threshold: 1.0e-06
  # 是否在优化后自动执行 Hammer 优化
  auto_hammer: false

# -----------------------------------------------------------------------------
# 公差分析配置
# -----------------------------------------------------------------------------
tolerance:
  # 默认蒙特卡洛采样数
  default_sample_count: 500

# -----------------------------------------------------------------------------
# 通用配置
# -----------------------------------------------------------------------------
# 工作目录
workspace_dir: ./workspace
# 检查点保存目录
checkpoint_dir: ./checkpoints
# 日志级别: DEBUG | INFO | WARNING | ERROR | CRITICAL
log_level: INFO
# 日志文件路径
log_file: ./logs/zemax_agent.log

# Zemax-Agent 配置文件示例
# 复制此文件为 config.yaml 并按需修改
# 环境变量覆盖规则：ZEMAX_AGENT_<SECTION>__<KEY>（优先级最高）

zos:
  connection_mode: standalone
  connection_timeout: 30.0
  auto_reconnect: true
  max_reconnect_attempts: 3
  task_queue_max_size: 100
  heartbeat_interval: 5.0

llm:
  provider: openai
  api_key: ""                    # 请填入你的 API Key
  api_base: https://api.openai.com/v1
  model: gpt-4
  max_tokens: 4096
  temperature: 0.1
  request_timeout: 60.0
  max_retries: 3
  context_window_size: 128000
  max_context_messages: 20

storage:
  db_path: ./zemax_agent.db
  qdrant_url: http://localhost:6333
  qdrant_prefer_grpc: false
  embedder_model: sentence-transformers/all-MiniLM-L6-v2
  embedder_device: cpu

project:
  workspace_dir: ./workspace
  template_dir: ./templates

optimization:
  max_iterations: 100
  convergence_threshold: 1.0e-06
  auto_hammer: false
  stagnation_threshold: 5
  stagnation_change_rate: 1.0e-04

tolerance:
  default_sample_count: 500

logging:
  level: INFO
  file: ./logs/zemax_agent.log
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
  date_format: "%Y-%m-%d %H:%M:%S"

workspace_dir: ./workspace
checkpoint_dir: ./checkpoints
